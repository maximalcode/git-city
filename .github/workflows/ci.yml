name: CI

# Typecheck, lint and unit tests on every push and pull request.
# The job is deliberately named "ci" — branch rulesets reference that exact
# name as a required status check, so renaming it would silently unprotect main.
#
# The Playwright e2e suite is not run here yet (Electron in CI needs a display
# server); see the "run Playwright e2e in CI" issue.

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test
