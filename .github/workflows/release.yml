name: 'Windows smoke diagnostics #185'

# Temporary diagnostic workflow for Git City #185. This branch intentionally
# runs only the native Windows diagnostic scenarios twice and never publishes
# a release. Restore the normal release workflow after timing evidence is
# collected.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-smoke:
    name: 'windows ${{ matrix.scenario }} (replicate ${{ matrix.replicate }})'
    runs-on: windows-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        scenario: [packaged, cli-only]
        replicate: [1, 2]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: npm ci

      - name: Prepare pinned Rehearse tool
        env:
          GH_TOKEN: ${{ github.token }}
        run: npm run tool:prepare -- win32-x64

      - name: Build Git City app
        if: matrix.scenario == 'packaged'
        run: npm run build

      - name: Build unpacked Windows package
        if: matrix.scenario == 'packaged'
        run: npx electron-builder --win --x64 --dir --publish never

      - name: 'Run original packaged smoke with #185 Python trace'
        if: matrix.scenario == 'packaged'
        env:
          PYTHONPATH: ${{ github.workspace }}/scripts/diagnostics/185
          GIT_CITY_185_TRACE: ${{ runner.temp }}/git-city-185-${{ matrix.scenario }}-${{ matrix.replicate }}.jsonl
          GIT_CITY_SMOKE_RESTARTS: 3
        run: node scripts/smoke-package.mjs "dist/win-unpacked/GitCity.exe"

      # The CLI-only scenario removes Electron launch and packaging while
      # preserving the exact Python child and its 180-second deadline.
      - name: 'Run CLI-only smoke 1 with #185 Python trace'
        if: matrix.scenario == 'cli-only'
        env:
          PYTHONPATH: ${{ github.workspace }}/scripts/diagnostics/185
          GIT_CITY_185_TRACE: ${{ runner.temp }}/git-city-185-${{ matrix.scenario }}-${{ matrix.replicate }}.jsonl
        run: node scripts/diagnostics/185/direct-cli-harness.mjs "build/rehearse/win32-x64/git-rehearse.exe"

      - name: 'Run CLI-only smoke 2 with #185 Python trace'
        if: matrix.scenario == 'cli-only'
        env:
          PYTHONPATH: ${{ github.workspace }}/scripts/diagnostics/185
          GIT_CITY_185_TRACE: ${{ runner.temp }}/git-city-185-${{ matrix.scenario }}-${{ matrix.replicate }}.jsonl
        run: node scripts/diagnostics/185/direct-cli-harness.mjs "build/rehearse/win32-x64/git-rehearse.exe"

      - name: 'Run CLI-only smoke 3 with #185 Python trace'
        if: matrix.scenario == 'cli-only'
        env:
          PYTHONPATH: ${{ github.workspace }}/scripts/diagnostics/185
          GIT_CITY_185_TRACE: ${{ runner.temp }}/git-city-185-${{ matrix.scenario }}-${{ matrix.replicate }}.jsonl
        run: node scripts/diagnostics/185/direct-cli-harness.mjs "build/rehearse/win32-x64/git-rehearse.exe"

      - name: 'Upload #185 trace and smoke evidence'
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-smoke-185-${{ matrix.scenario }}-${{ matrix.replicate }}
          path: |
            ${{ runner.temp }}/git-city-185-${{ matrix.scenario }}-${{ matrix.replicate }}.jsonl
            test-results/package-smoke/
          if-no-files-found: ignore
