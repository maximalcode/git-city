name: Release

# Builds the installers for every supported platform: an NSIS .exe on
# windows-latest, native Intel/Apple Silicon macOS DMGs, and AppImage + deb
# on ubuntu-latest. PRs build and smoke-test without publishing.
#   - Push a tag  v*  ->  builds AND publishes a GitHub Release with every
#     installer attached.
#   - "Run workflow" button (workflow_dispatch)  ->  builds only, uploads the
#     installers as run artifacts so you can grab them without cutting a
#     release (a dry run).
#
# To cut a real release:  bump "version" in package.json, commit, then:
#     git tag v1.0.0 && git push origin v1.0.0
# The build jobs refuse to run if the tag (v1.0.0) and package.json version
# (1.0.0) disagree.
#
# The build jobs never touch the Release themselves — they only publish
# artifacts, and a final job collects those into one Release. That way the
# platforms cannot race each other to create it.

on:
  push:
    tags:
      - 'v*'
  pull_request:
    branches: [develop, main]
  workflow_dispatch:

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win32
            arch: x64
            build: win
            executable: dist/win-unpacked/GitCity.exe
            artifact: dist/*-setup.exe
          - os: macos-latest
            platform: darwin
            arch: arm64
            build: mac
            executable: dist/mac-arm64/Git City.app/Contents/MacOS/Git City
            artifact: dist/*.dmg
          - os: macos-15-intel
            platform: darwin
            arch: x64
            build: mac
            executable: dist/mac/Git City.app/Contents/MacOS/Git City
            artifact: dist/*.dmg
          - os: ubuntu-latest
            platform: linux
            arch: x64
            build: linux
            executable: dist/linux-unpacked/git-city
            artifact: |
              dist/*.AppImage
              dist/*.deb
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - name: Verify tag matches package.json version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          test "${GITHUB_REF_NAME#v}" = "$(node -p "require('./package.json').version")"
      - name: Prepare pinned and checksummed tool
        env:
          GH_TOKEN: ${{ github.token }}
        run: npm run tool:prepare -- ${{ matrix.platform }}-${{ matrix.arch }}
      - run: npm run typecheck && npm run lint && npm test
      - run: npm run dist:${{ matrix.build }} -- --${{ matrix.arch }}
      - name: Packaged application and upgrade smoke (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a node scripts/smoke-package.mjs "${{ matrix.executable }}"
      - name: Packaged application and upgrade smoke
        if: runner.os != 'Linux'
        run: node scripts/smoke-package.mjs "${{ matrix.executable }}"
      - uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.platform }}-${{ matrix.arch }}
          path: ${{ matrix.artifact }}
          if-no-files-found: error

  # Only on a version tag: collect every platform's artifact into a single
  # Release with auto-generated notes.
  publish:
    needs: package
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download installers
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "$GITHUB_REF_NAME" artifacts/*/* --title "$GITHUB_REF_NAME" --generate-notes
