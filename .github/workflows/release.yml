name: Release

# Builds the installers for every supported platform.
#   - Push a tag  v*  ->  builds AND publishes a GitHub Release with every
#     installer attached.
#   - "Run workflow" button (workflow_dispatch)  ->  builds only, uploads the
#     installers as run artifacts so you can grab them without cutting a
#     release (a dry run).
#
# To cut a real release:  bump "version" in package.json, commit, then:
#     git tag v1.0.0 && git push origin v1.0.0
# The build jobs refuse to run if the tag (v1.0.0) and package.json version
# (1.0.0) disagree.
#
# The two build jobs never touch the Release themselves — they only publish
# artifacts, and a third job collects those into one Release. That way the
# platforms cannot race each other to create it.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-win:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Guard: a  v1.0.0  tag must match  "version": "1.0.0"  in package.json,
      # otherwise the installer would be named after the wrong version.
      - name: Verify tag matches package.json version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "::error::Tag v$tag does not match package.json version $pkg. Bump package.json and re-tag."
            exit 1
          fi
          echo "Tag and package.json agree on version $pkg."

      - name: Run tests
        run: npm test

      - name: Build Windows installer
        run: npm run dist:win

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: installer-windows
          path: dist/*-setup.exe
          if-no-files-found: error

  build-mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify tag matches package.json version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "::error::Tag v$tag does not match package.json version $pkg. Bump package.json and re-tag."
            exit 1
          fi
          echo "Tag and package.json agree on version $pkg."

      - name: Run tests
        run: npm test

      # Builds both arm64 and x64 DMGs (see electron-builder.yml) — the runner
      # is Apple Silicon, so the x64 one is a cross-build. Intel Macs are still
      # common enough that shipping arm64 only would strand a chunk of users.
      - name: Build macOS installers
        run: npm run dist:mac

      - name: Upload installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: installer-macos
          path: dist/*.dmg
          if-no-files-found: error

  # Only on a version tag: collect every platform's artifact into a single
  # Release with auto-generated notes.
  publish:
    needs: [build-win, build-mac]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download installers
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "$GITHUB_REF_NAME" artifacts/*/* --title "$GITHUB_REF_NAME" --generate-notes
