name: 'Windows smoke diagnostics #185'

# Temporary diagnostic workflow for Git City #185. This branch intentionally
# runs only the native Windows packaged smoke twice and never publishes a
# release. Restore the normal release workflow after timing evidence is
# collected.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-smoke:
    name: 'windows ${{ matrix.scenario }} (replicate ${{ matrix.replicate }})'
    runs-on: windows-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        scenario: [packaged]
        replicate: [1, 2]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: npm ci

      - name: Prepare pinned Rehearse tool
        env:
          GH_TOKEN: ${{ github.token }}
        run: npm run tool:prepare -- win32-x64

      - name: Build Git City app
        run: npm run build

      # Match the release workflow's NSIS target; the unpacked output is used
      # for launch while preserving the normal packaging path.
      - name: Build unpacked Windows package
        run: npx electron-builder --win nsis --x64 --publish never

      - name: 'Run bundled CLI baseline before packaged smoke'
        env:
          PYTHONPATH: ${{ github.workspace }}/scripts/diagnostics/185
          GIT_CITY_185_TRACE: ${{ runner.temp }}/git-city-185-pre-${{ matrix.replicate }}.jsonl
        run: node scripts/diagnostics/185/direct-cli-harness.mjs "dist/win-unpacked/resources/rehearse/git-rehearse.exe"

      - name: 'Run original packaged smoke with #185 Python trace'
        env:
          PYTHONPATH: ${{ github.workspace }}/scripts/diagnostics/185
          GIT_CITY_185_TRACE: ${{ runner.temp }}/git-city-185-packaged-${{ matrix.replicate }}.jsonl
          GIT_CITY_SMOKE_RESTARTS: 3
        run: node scripts/smoke-package.mjs "dist/win-unpacked/GitCity.exe"

      - name: 'Run bundled CLI baseline after packaged smoke'
        if: always() && matrix.scenario == 'packaged'
        env:
          PYTHONPATH: ${{ github.workspace }}/scripts/diagnostics/185
          GIT_CITY_185_TRACE: ${{ runner.temp }}/git-city-185-post-${{ matrix.replicate }}.jsonl
        shell: pwsh
        run: |
          $binary = 'dist/win-unpacked/resources/rehearse/git-rehearse.exe'
          if (!(Test-Path -LiteralPath $binary)) {
            Write-Host "[DEBUG-185] post-smoke bundled binary is unavailable; packaging did not complete"
            exit 0
          }
          node scripts/diagnostics/185/direct-cli-harness.mjs $binary
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: 'Upload #185 trace and smoke evidence'
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-smoke-185-${{ matrix.scenario }}-${{ matrix.replicate }}
          path: |
            ${{ runner.temp }}/git-city-185-pre-${{ matrix.replicate }}.jsonl
            ${{ runner.temp }}/git-city-185-packaged-${{ matrix.replicate }}.jsonl
            ${{ runner.temp }}/git-city-185-post-${{ matrix.replicate }}.jsonl
            test-results/package-smoke/
          if-no-files-found: ignore
