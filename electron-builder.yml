appId: com.maximalcode.gitcity
productName: Git City
directories:
  buildResources: build
  output: dist
files:
  - '!src/*'
  - '!scripts/*'
  - '!.claude/*'
  - '!electron.vite.config.ts'
  - '!vite.preview.config.ts'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
  - '!{README.md,.gitignore}'
  - '!dist/*'
asar: true
npmRebuild: false
win:
  executableName: GitCity
  icon: build/icon.png
  target:
    - nsis
nsis:
  artifactName: ${name}-${version}-setup.${ext}
  shortcutName: ${productName}
  createDesktopShortcut: always
  oneClick: false
  allowToChangeInstallationDirectory: true
mac:
  category: public.app-category.developer-tools
  icon: build/icon.png
  target:
    - target: dmg
      # Intel Macs are still common; arm64 alone would strand them. The x64
      # DMG is a cross-build from the Apple Silicon runner.
      arch:
        - arm64
        - x64
dmg:
  artifactName: ${name}-${version}-${arch}.${ext}
linux:
  executableName: git-city
  icon: build/icon.png
  category: Development
  # fpm requires a maintainer for the .deb; the noreply alias keeps the
  # package metadata as pseudonymous as the commit history
  maintainer: maximalcode <213183497+maximalcode@users.noreply.github.com>
  # AppImage runs on any distro with no install step; deb covers the apt
  # family. rpm/snap/flatpak deliberately left out until someone asks (#64).
  target:
    - AppImage
    - deb
  artifactName: ${name}-${version}-${arch}.${ext}
